<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>论文阅读室</title>
<script>
MathJax = {tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},svg:{fontCache:'global'}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--nav-w:300px;--bg:#f8f6f2;--nav-bg:#2c2c2c;--text:#1a1a1a;--muted:#666;--accent:#b8860b}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
/* nav */
nav#nav{position:fixed;top:0;left:0;width:var(--nav-w);height:100vh;overflow-y:auto;background:var(--nav-bg);color:#eee;padding:1rem 0;z-index:10}
nav#nav .nav-header{padding:0 1rem 1rem;border-bottom:1px solid #444;margin-bottom:.5rem}
nav#nav .nav-header h2{font-size:1rem;font-weight:600;color:#fff}
nav#nav .nav-header p{font-size:.75rem;color:#999;margin-top:2px}
nav#nav .nav-item{display:block;padding:.6rem 1rem;color:#ccc;text-decoration:none;border-left:3px solid transparent;transition:all .15s}
nav#nav .nav-item:hover{background:#3a3a3a;color:#fff;border-left-color:var(--accent)}
nav#nav .nav-item.active{background:#3a3a3a;color:#fff;border-left-color:var(--accent)}
nav#nav .nav-title{display:block;font-size:.85rem;line-height:1.3}
nav#nav .nav-sub{display:block;font-size:.7rem;color:#888;margin-top:2px}
/* main */
main{margin-left:var(--nav-w);flex:1;padding:2rem 3rem;max-width:960px}
.empty-state{text-align:center;padding:6rem 2rem;color:var(--muted)}
.empty-state h2{font-size:1.5rem;margin-bottom:.5rem}
.empty-state p{font-size:.9rem}
/* paper section */
section.paper{display:none}
section.paper.active{display:block}
.paper-head{margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid #ddd}
.paper-head h1{font-size:1.6rem;line-height:1.35;margin-bottom:.25rem}
.paper-head .orig-title{font-size:.85rem;color:var(--muted);margin-bottom:.25rem}
.paper-head .meta-line{font-size:.8rem;color:var(--muted)}
.tagrow{margin-top:.5rem}
.tag{display:inline-block;font-size:.7rem;background:#e8e0d0;color:#5a4a2a;padding:2px 8px;border-radius:3px;margin-right:4px;margin-top:4px}
.tabs{display:flex;gap:0;margin-top:1rem;border-bottom:2px solid #ddd}
.tab{padding:.5rem 1rem;font-size:.85rem;cursor:pointer;border:none;background:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.pane{display:none;margin-top:1.5rem}
.pane.active{display:block}
/* prose */
.prose{font-size:.95rem;line-height:1.75}
.prose h2{font-size:1.25rem;margin:1.5rem 0 .75rem;color:#1a1a1a}
.prose h3{font-size:1.05rem;margin:1.25rem 0 .5rem}
.prose p{margin-bottom:.75rem;text-align:justify}
.prose ul,.prose ol{padding-left:1.5rem;margin-bottom:.75rem}
.prose li{margin-bottom:.25rem}
.prose blockquote{border-left:3px solid #ccc;padding:.25rem 1rem;margin:.75rem 0;color:var(--muted);font-size:.9rem}
.prose table{border-collapse:collapse;margin:.75rem 0;width:100%;font-size:.85rem}
.prose th,.prose td{border:1px solid #ccc;padding:6px 10px;text-align:left}
.prose th{background:#eee;font-weight:600}
.prose code{font-family:"JetBrains Mono","SF Mono","Fira Code",monospace;font-size:.85em;background:#eee;padding:1px 4px;border-radius:3px}
.prose .note{color:var(--muted);font-style:italic}
.prose .figure{background:#f0ede8;border-left:3px solid var(--accent);padding:.75rem 1rem;margin:.75rem 0;font-size:.88rem;color:var(--muted)}
.prose .figure strong{color:var(--text)}
/* responsive */
@media(max-width:768px){
  nav#nav{position:relative;width:100%;height:auto;max-height:40vh}
  main{margin-left:0;padding:1rem}
}
</style>
</head>
<body>
<nav id="nav">
  <div class="nav-header">
    <h2>📖 论文阅读室</h2>
    <p>共 {{COUNT}} 篇 · 更新于 {{UPDATED}}</p>
  </div>
  {{NAV}}
</nav>
<main>
  {{SECTIONS}}
  <div class="empty-state" id="empty-state">
    <h2>📚 书架还空着</h2>
    <p>把论文 PDF 放进目录,让 Claude 处理即可。</p>
  </div>
</main>
<script>
(()=>{
  // nav highlight
  const navItems=document.querySelectorAll('.nav-item');
  const sections=document.querySelectorAll('.paper');
  const empty=document.getElementById('empty-state');
  let current=null;
  function show(slug){
    if(current===slug)return;
    navItems.forEach(n=>n.classList.toggle('active',n.dataset.slug===slug));
    sections.forEach(s=>s.classList.toggle('active',s.dataset.slug===slug));
    empty.hidden=!!slug;
    current=slug;
  }
  // click nav
  navItems.forEach(a=>{a.addEventListener('click',e=>{e.preventDefault();show(a.dataset.slug);history.replaceState(null,'',a.getAttribute('href'))})});
  // hash on load
  if(location.hash){const t=document.querySelector(`.nav-item[href="${location.hash}"]`);if(t)show(t.dataset.slug)}
  // tabs
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const sec=btn.closest('.paper');
      sec.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      sec.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      sec.querySelector('.pane-'+btn.dataset.pane).classList.add('active');
    });
  });
  // keyboard
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();show(null);history.replaceState(null,'','#')}
  });
})();
</script>
</body>
</html>
